[project]
name = "rag"
version = "0.1.0"
description = "Production-grade RAG system"
authors = [
    { name = "Sathish R", email = "sathish01072000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.3",
    "langfuse>=2.50.0",
    "litellm>=1.87.0",
    "numpy>=2.1.0",
    "pgvector>=0.4.2",
    "prometheus-client>=0.21.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.27.2.3",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2",
    "sse-starlette>=2.1.0",
    "structlog>=25.5.0",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
rag-ingest = "rag.ingestion.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.15",
    "testcontainers[postgres]>=4.14.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rag"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf", "fitz", "pgvector.*", "testcontainers.*", "litellm", "litellm.*", "yaml", "sse_starlette.*", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-m 'not integration and not live' -v"
markers = [
    "integration: needs a real Postgres via Docker (testcontainers)",
    "live: needs real provider API keys (GEMINI_API_KEY)",
]
pythonpath = ["src"]
testpaths = ["tests"]
